worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 16m;

  upstream martin {
    server martin:3000;
    keepalive 16;
  }

  upstream valhalla {
    server valhalla:8002;
    keepalive 16;
  }

  upstream nominatim {
    server nominatim:8080;
    keepalive 16;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /tiles/ {
      proxy_pass http://martin/;
      add_header Cache-Control "public, max-age=3600";
    }

    location /fonts/ {
      proxy_pass http://martin/fonts/;
      add_header Cache-Control "public, max-age=604800";
    }

    location /routing/ {
      proxy_pass http://valhalla/;
    }

    location /geocode/ {
      proxy_pass http://nominatim/;
    }

    location /imagery/ {
      set $titiler_upstream titiler:8000;
      rewrite ^/imagery/(.*)$ /$1 break;
      proxy_pass http://$titiler_upstream;
      add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
